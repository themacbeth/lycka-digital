<!DOCTYPE html>
<html>
<head><title>OG Image Generator</title></head>
<body style="background:#222;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;margin:0;font-family:sans-serif;color:#fff;">
<p>Right-click the image below and "Save image as..." → save to <b>assets/images/lycka-og.png</b></p>
<canvas id="c" width="1200" height="630" style="border:1px solid #444;max-width:90%;"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// Black background
ctx.fillStyle = '#000000';
ctx.fillRect(0, 0, 1200, 630);

// Load and center the logo
const img = new Image();
img.onload = function() {
    // Scale logo to fit nicely — max 280px tall, centered
    const maxH = 280;
    const scale = Math.min(maxH / img.height, maxH / img.width);
    const w = img.width * scale;
    const h = img.height * scale;
    const x = (1200 - w) / 2;
    const y = (630 - h) / 2 - 20;
    ctx.drawImage(img, x, y, w, h);

    // Add "LYCKA" text below logo
    ctx.font = '600 42px "Space Grotesk", "Segoe UI", sans-serif';
    ctx.fillStyle = '#FFFFFF';
    ctx.textAlign = 'center';
    ctx.fillText('LYCKA', 600, y + h + 52);

    // Subtle tagline
    ctx.font = '300 18px "Segoe UI", sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.fillText('Biotech Marketing Agency', 600, y + h + 84);
};
img.src = 'assets/images/Lycka-logo.png';
</script>
</body>
</html>
